<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숙희 AI 상담</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">

<style>
/* === 토큰 === */
:root {
  --bg: #f7f4f0;
  --surface: #ffffff;
  --border: #e8e3dc;
  --fg: #2a2520;
  --fg2: #7a7168;
  --accent: #c4937a;
  --accent-dk: #a87660;
  --bubble-her: #ffffff;
  --bubble-me: #c4937a;
  --bubble-me-fg: #ffffff;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1714; --surface: #242018; --border: #3a342c;
    --fg: #f0ebe4; --fg2: #9a9080;
    --accent: #c4937a; --accent-dk: #d4a38a;
    --bubble-her: #2e2820; --bubble-me: #c4937a; --bubble-me-fg: #fff;
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1714; --surface: #242018; --border: #3a342c;
  --fg: #f0ebe4; --fg2: #9a9080;
  --accent: #c4937a; --accent-dk: #d4a38a;
  --bubble-her: #2e2820; --bubble-me: #c4937a; --bubble-me-fg: #fff;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--fg);
}

.layout {
  display: flex;
  height: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  gap: 24px;
}

/* 숙희 프로필 패널 */
.profile-panel {
  width: 240px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.profile-card {
  background: var(--surface);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  width: 100%;
}

.profile-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3/4;
  overflow: hidden;
}

.profile-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

.online-dot {
  position: absolute;
  bottom: 12px;
  right: 12px;
  width: 12px;
  height: 12px;
  background: #4caf7d;
  border-radius: 50%;
  border: 2px solid var(--surface);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,125,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(76,175,125,0); }
}

.profile-info {
  padding: 16px;
  text-align: center;
}

.profile-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--fg);
  margin-bottom: 4px;
}

.profile-title {
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.profile-desc {
  font-size: 13px;
  color: var(--fg2);
  line-height: 1.6;
}

.quick-btns {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.quick-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--fg);
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.quick-btn:hover {
  border-color: var(--accent);
  color: var(--accent-dk);
  background: color-mix(in srgb, var(--accent) 8%, var(--surface));
}

.quick-btn .icon { font-size: 16px; }

/* 채팅 패널 */
.chat-panel {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  overflow: hidden;
}

.chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
}

.chat-header-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--accent);
  flex-shrink: 0;
}

.chat-header-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

.chat-header-info { flex: 1; min-width: 0; }

.chat-header-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--fg);
}

.chat-header-status {
  font-size: 12px;
  color: #4caf7d;
  display: flex;
  align-items: center;
  gap: 4px;
}

.chat-header-status::before {
  content: "";
  width: 6px;
  height: 6px;
  background: #4caf7d;
  border-radius: 50%;
  display: inline-block;
}

.shop-tag {
  font-size: 12px;
  color: var(--fg2);
  background: color-mix(in srgb, var(--accent) 12%, var(--bg));
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 500;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.msg-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.msg-row.me {
  flex-direction: row-reverse;
}

.msg-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  border: 1.5px solid var(--border);
}

.msg-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

.msg-bubble {
  max-width: 72%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.6;
  background: var(--bubble-her);
  color: var(--fg);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  animation: fadeUp 0.25s ease;
}

.msg-row.me .msg-bubble {
  background: var(--bubble-me);
  color: var(--bubble-me-fg);
  border: none;
  border-bottom-right-radius: 4px;
  border-bottom-left-radius: 18px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.typing {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 10px 14px;
}

.typing span {
  width: 7px; height: 7px;
  background: var(--fg2);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
}

.api-notice {
  background: color-mix(in srgb, var(--accent) 10%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 12.5px;
  color: var(--fg2);
  line-height: 1.6;
  margin: 0 20px 8px;
}

.api-notice strong { color: var(--accent-dk); }

.input-row {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--surface);
}

.msg-input {
  flex: 1;
  min-width: 0;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--fg);
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  min-height: 44px;
  max-height: 120px;
  overflow-y: auto;
}

.msg-input:focus { border-color: var(--accent); }
.msg-input::placeholder { color: var(--fg2); }

.send-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}

.send-btn:hover { background: var(--accent-dk); }

.send-btn svg { width: 20px; height: 20px; fill: white; }

/* API 키 설정 */
.api-setup {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
  background: color-mix(in srgb, var(--accent) 5%, var(--surface));
}

.api-input {
  flex: 1;
  min-width: 0;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--fg);
  outline: none;
}
.api-input:focus { border-color: var(--accent); }

.api-save-btn {
  padding: 8px 16px;
  border-radius: 10px;
  background: var(--accent);
  border: none;
  color: white;
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s;
}
.api-save-btn:hover { background: var(--accent-dk); }

/* 반응형 */
@media (max-width: 600px) {
  .layout { flex-direction: column; padding-block: 0; gap: 0; border-radius: 0; }
  .profile-panel { width: 100%; flex-direction: row; padding: 12px; align-items: center; background: var(--surface); border-bottom: 1px solid var(--border); }
  .profile-card { display: none; }
  .quick-btns { flex-direction: row; flex-wrap: wrap; }
  .quick-btn { font-size: 12px; padding: 7px 10px; }
  .chat-panel { border-radius: 0; border: none; flex: 1; }
}
</style>

<div class="layout">

  <!-- 왼쪽: 숙희 프로필 -->
  <div class="profile-panel">
    <div class="profile-card">
      <div class="profile-img-wrap">
        <video id="seoyeon-video" autoplay muted playsinline style="display:none;width:100%;height:100%;object-fit:cover;border-radius:50%;"></video>
        <img id="seoyeon-img" src="" alt="숙희" style="display:none;">
        <div class="online-dot"></div>
      </div>
      <div class="profile-info">
        <div class="profile-name">숙희</div>
        <div class="profile-title">한빛컴퓨터 상담</div>
        <div class="profile-desc">견적·수리·궁금한 것 뭐든 편하게 물어보세요 😊</div>
      </div>
    </div>

    <div class="quick-btns">
      <button class="quick-btn" onclick="quickSend('견적 문의')"><span class="icon">💻</span> 견적 문의</button>
      <button class="quick-btn" onclick="quickSend('수리 문의')"><span class="icon">🔧</span> 수리 문의</button>
      <button class="quick-btn" onclick="quickSend('위치·운영시간 알려줘')"><span class="icon">📍</span> 위치·시간</button>
      <button class="quick-btn" onclick="quickSend('AS 문의')"><span class="icon">🛠️</span> AS 문의</button>
    </div>
  </div>

  <!-- 오른쪽: 채팅 -->
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-avatar">
        <img id="header-img" src="" alt="숙희">
      </div>
      <div class="chat-header-info">
        <div class="chat-header-name">숙희</div>
        <div class="chat-header-status">온라인</div>
      </div>
      <div class="shop-tag">한빛컴퓨터</div>
    </div>

    <div class="messages" id="messages"></div>

    
    <div class="input-row">
      <textarea class="msg-input" id="user-input" placeholder="궁금한 것을 입력하세요..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

function playWelcomeVideo() {
  const video = document.getElementById('seoyeon-video');
  const img = document.getElementById('seoyeon-img');
  video.src = VIDEO_SRC;
  video.style.display = 'block';
  img.style.display = 'none';
  const playPromise = video.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      // 자동재생 차단 시 이미지로 폴백
      video.style.display = 'none';
      img.style.display = 'block';
      setExpr('smile');
    });
  }
  video.onended = () => {
    video.style.display = 'none';
    img.style.display = 'block';
    setExpr('smile');
  };
}

function setExpr(expr) {
  const src = IMGS[expr] || IMGS.default;
  document.getElementById('seoyeon-img').src = src;
  document.getElementById('header-img').src  = src;
}

let isSending = false;
async function sendMessage() {
  const inp=document.getElementById('user-input');
  const text=inp.value.trim();if(!text||isSending)return;
  isSending=true;inp.value='';inp.style.height='';addMsg(text,true);
  document.querySelector('.send-btn').disabled=true;
  const msgs=document.getElementById('messages');
  const row=document.createElement('div');row.className='msg-row';
  const avatar=document.createElement('div');avatar.className='msg-avatar';
  const image=document.createElement('img');image.src=IMGS.talk;image.alt='숙희';avatar.append(image);
  const bubble=document.createElement('div');bubble.className='msg-bubble';bubble.textContent='답변을 준비하고 있어요…';
  row.append(avatar,bubble);msgs.append(row);msgs.scrollTop=msgs.scrollHeight;
  let fullReply='';
  try {
    const pendingHistory=[...history,{role:'user',content:text}].slice(-39);
    setExpr(getExprFor(text));
    await requestSookheeGeminiStream(SYSTEM,pendingHistory,chunk=>{
      fullReply+=chunk;bubble.textContent=fullReply;msgs.scrollTop=msgs.scrollHeight;
    });
    history.push({role:'user',content:text},{role:'assistant',content:fullReply});
    if(history.length>38)history.splice(0,history.length-38);
  } catch(error) {
    if(!fullReply)row.remove();
    else {const note=document.createElement('p');note.textContent='(응답이 중단됐습니다.)';bubble.append(note);}
    const message=['TimeoutError','AbortError'].includes(error.name)?'응답 시간이 길어지고 있어요. 잠시 후 다시 시도해 주세요.':error instanceof TypeError?'상담 서버 연결을 확인하고 다시 시도해 주세요.':error.message;
    addMsg(message,false);
  } finally {
    isSending=false;document.querySelector('.send-btn').disabled=false;
    setTimeout(()=>setExpr('default'),3000);
  }
}

function quickSend(text) {
  if(isSending) return;
  if (text === '견적 문의') {
    playWelcomeVideo();
  }
  document.getElementById('user-input').value = text;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── 첫 인사 ──
setTimeout(() => {
  playWelcomeVideo();
  addMsg('안녕하세요, 울산한빛컴퓨터 숙희에요 😊', false);
  setTimeout(() => addMsg('견적, 수리, AS 무엇이든 편하게 물어보세요!', false), 700);
}, 500);
</script>
